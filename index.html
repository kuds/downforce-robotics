<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downforce Robotics</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background-color: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 2rem 2.5rem;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 200;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .hero .accent-line {
      width: 48px;
      height: 1px;
      background-color: #c0392b;
      margin: 1.5rem auto;
    }

    .hero p {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Downforce Robotics</div>
  </header>
  <main>
    <div class="hero">
      <h1>Coming Soon</h1>
      <div class="accent-line"></div>
      <p>Autonomous racing, engineered from the ground up</p>
    </div>
  </main>
</body>
</html>
