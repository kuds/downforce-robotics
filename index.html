<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downforce Robotics</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon_io/favicon-96x96.png">
  <link rel="icon" type="image/svg+xml" href="/favicon_io/favicon.svg">
  <link rel="shortcut icon" href="/favicon_io/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <style>
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      padding: 0.75rem 1.5rem;
      background-color: #c0392b;
      color: #fff;
      font-size: 0.85rem;
      z-index: 200;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 0;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background-color: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 2rem 2.5rem;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 200;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .hero .accent-line {
      width: 48px;
      height: 1px;
      background-color: #c0392b;
      margin: 1.5rem auto;
    }

    .hero p {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #999;
    }

    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #141414;
      border-top: 1px solid #222;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      z-index: 100;
    }

    .cookie-banner.hidden {
      display: none;
    }

    .cookie-banner p {
      font-size: 0.8rem;
      color: #888;
      line-height: 1.5;
    }

    .cookie-banner .actions {
      display: flex;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .cookie-banner button {
      padding: 0.5rem 1.25rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-family: inherit;
    }

    .cookie-banner .btn-accept {
      background-color: #c0392b;
      color: #fff;
    }

    .cookie-banner button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .cookie-banner .btn-decline {
      background-color: transparent;
      color: #999;
      border: 1px solid #666;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header>
    <div class="logo">Downforce Robotics</div>
  </header>
  <main id="main-content">
    <div class="hero">
      <h1>Coming Soon</h1>
      <div class="accent-line" aria-hidden="true"></div>
      <p>Autonomous racing, engineered from the ground up</p>
    </div>
  </main>

  <div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Cookie consent" aria-describedby="cookie-message">
    <p id="cookie-message">We use cookies to analyze site traffic. You can disable tracking at any time.</p>
    <div class="actions">
      <button class="btn-decline" onclick="declineCookies()">Decline</button>
      <button class="btn-accept" onclick="acceptCookies()">Accept</button>
    </div>
  </div>

  <script>
    var GA_ID = 'G-YE98K6PJ1T';

    function loadGA() {
      var script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      script.async = true;
      document.head.appendChild(script);
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', GA_ID, { anonymize_ip: true });
    }

    function removeGA() {
      window['ga-disable-' + GA_ID] = true;
      var scripts = document.querySelectorAll('script[src*="googletagmanager"]');
      scripts.forEach(function(s) { s.remove(); });
      window.dataLayer = [];
    }

    function acceptCookies() {
      localStorage.setItem('cookie-consent', 'accepted');
      document.getElementById('cookie-banner').classList.add('hidden');
      loadGA();
    }

    function declineCookies() {
      localStorage.setItem('cookie-consent', 'declined');
      document.getElementById('cookie-banner').classList.add('hidden');
      removeGA();
    }

    (function() {
      var consent = localStorage.getItem('cookie-consent');
      if (consent === 'accepted') {
        document.getElementById('cookie-banner').classList.add('hidden');
        loadGA();
      } else if (consent === 'declined') {
        document.getElementById('cookie-banner').classList.add('hidden');
      }
    })();
  </script>
</body>
</html>
